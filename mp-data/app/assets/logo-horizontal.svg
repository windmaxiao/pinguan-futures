<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 88" width="460" height="88">
  <defs>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f3b30" />
      <stop offset="100%" stop-color="#12261f" />
    </linearGradient>
    <linearGradient id="beanH" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fed678" />
      <stop offset="60%" stop-color="#eeb044" />
      <stop offset="100%" stop-color="#c9821d" />
    </linearGradient>
    <linearGradient id="leafH" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b7a57" />
      <stop offset="100%" stop-color="#72c48d" />
    </linearGradient>
  </defs>

  <!-- 左侧图标外框 (72x72) -->
  <g transform="translate(8, 8)">
    <rect width="72" height="72" rx="18" fill="url(#bgH)" />
    <rect x="0.5" y="0.5" width="71" height="71" rx="17.5" fill="none" stroke="#e0a944" stroke-width="1" stroke-opacity="0.3" />

    <!-- 大豆主体 -->
    <path d="M 26 15 
             C 42 10, 58 21, 58 37 
             C 58 52, 42 61, 27 56 
             C 14 51, 11 37, 17 25 
             C 19 21, 23 17, 26 15 Z" 
          fill="url(#beanH)" />

    <!-- 自然微弧豆脐 -->
    <path d="M 20 28 C 18 33, 19 39, 23 44" 
          fill="none" stroke="#875312" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.65" />

    <!-- 三根行情K线（完全收纳在豆体内部） -->
    <line x1="33" y1="31" x2="33" y2="44" stroke="#102b21" stroke-width="1.2" stroke-linecap="round" />
    <rect x="31.4" y="33" width="3.2" height="8.5" rx="1" fill="#102b21" />

    <line x1="40" y1="26" x2="40" y2="45" stroke="#102b21" stroke-width="1.2" stroke-linecap="round" />
    <rect x="38.4" y="29" width="3.2" height="12.5" rx="1" fill="#102b21" />

    <line x1="47" y1="21" x2="47" y2="43" stroke="#102b21" stroke-width="1.2" stroke-linecap="round" />
    <rect x="45.4" y="24" width="3.2" height="14" rx="1" fill="#102b21" />

    <!-- 嫩芽 -->
    <path d="M 50 17 C 56 13, 60 15, 59 21 C 56 23, 51 21, 50 17 Z" fill="url(#leafH)" />
  </g>

  <!-- 右侧中英文字体排版 -->
  <g transform="translate(96, 13)">
    <!-- 主品牌名固定为「品观」 -->
    <text x="0" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#1f2420" letter-spacing="1.5">品观</text>
    
    <!-- 品种可变胶囊标签（轻量灰绿背景，不写死为主标题） -->
    <g transform="translate(68, 12)">
      <rect width="44" height="22" rx="4" fill="#edebe3" stroke="#c8c4b7" stroke-width="1" />
      <text x="22" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#3a5245" text-anchor="middle">豆粕</text>
    </g>

    <!-- 弱化版 MP-DATA 徽章：精致细描边浅底，视觉重量适中，不抢主标题 -->
    <g transform="translate(122, 12)">
      <rect width="78" height="22" rx="4" fill="none" stroke="#2d5542" stroke-width="1.2" stroke-opacity="0.45" />
      <text x="39" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#2d5542" text-anchor="middle" letter-spacing="0.8">MP-DATA</text>
    </g>

    <!-- 副标题：统一分隔符为“·”，排版干净舒展 -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#767c70" letter-spacing="0.4">期货品种数据与研究台 <tspan fill="#5d6e44">·</tspan> 一个品种 <tspan fill="#5d6e44">·</tspan> 一套框架 <tspan fill="#5d6e44">·</tspan> 一页纸</text>
  </g>
</svg>
