# 品观 · 数据站 nginx 配置（含访问门禁）
# 部署到 /etc/nginx/sites-available/data，替换站点域名后启用
server {
    listen 80;
    server_name data.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name data.example.com;

    ssl_certificate     /etc/nginx/ssl/data.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/data.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_prefer_server_ciphers on;

    root  /srv/mp-data/site;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;

    # 解锁页：未解锁也必须能访问
    location = /style.css {
        try_files $uri =404;
    }

    # Favicon 由浏览器自动请求，不经门禁（否则会拿到解锁页 HTML）
    # 兼容旧客户端：它们会无视 <link rel="icon"> 直接探测 /favicon.ico
    location ~* ^/favicon\.(svg|ico)$ {
        try_files $uri =404;
    }

    location = /unlock.html {
        try_files $uri =404;
    }

    # 管理页同样不经门禁：它由管理码保护，而不是访问码。
    # 否则忘记访问码时会陷入死锁——进不去管理页，也就无法生成新访问码。
    # 验证前页面只有管理码输入框，不含任何数据。
    location = /admin.html {
        try_files $uri =404;
    }

    # 登录接口限流：每 IP 每分钟 10 次（防暴力尝试）
    # 限流区 mp_login 定义在 /etc/nginx/conf.d/mp-ratelimit.conf（http 上下文）
    location = /auth/login {
        limit_req zone=mp_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /auth/admin/login {
        limit_req zone=mp_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 被限流时返回 JSON，前端能显示提示而不是解析失败
    error_page 429 @too_many;
    location @too_many {
        default_type application/json;
        return 429 '{"ok":false,"error":"请求过于频繁，请稍后再试"}';
    }

    # 门禁接口：未解锁也必须能访问
    location /auth/ {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 鉴权子请求，仅内部使用
    location = /auth/check {
        internal;
        proxy_pass http://127.0.0.1:8765/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location / {
        auth_request /auth/check;
        error_page 401 = /unlock.html;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        auth_request /auth/check;
        error_page 401 = /unlock.html;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. {
        deny all;
    }
}
