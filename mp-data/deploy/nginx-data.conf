# 品观 · 数据站 nginx 配置（含访问门禁）
# 部署到 /etc/nginx/sites-available/data，替换站点域名后启用
server {
    listen 80;
    server_name data.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name data.example.com;

    ssl_certificate     /etc/nginx/ssl/data.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/data.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_prefer_server_ciphers on;

    root  /srv/mp-data/site;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;

    # 解锁页：未解锁也必须能访问
    location = /style.css {
        try_files $uri =404;
    }

    location = /unlock.html {
        try_files $uri =404;
    }

    # 门禁接口：未解锁也必须能访问
    location /auth/ {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 鉴权子请求，仅内部使用
    location = /auth/check {
        internal;
        proxy_pass http://127.0.0.1:8765/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location / {
        auth_request /auth/check;
        error_page 401 = /unlock.html;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        auth_request /auth/check;
        error_page 401 = /unlock.html;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. {
        deny all;
    }
}
