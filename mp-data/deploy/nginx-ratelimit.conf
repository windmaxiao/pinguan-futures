# 门禁登录接口限流
#
# 部署位置：/etc/nginx/conf.d/mp-ratelimit.conf
# 必须放在 http 上下文（conf.d 会被 nginx.conf 的 http 块 include，
# 且加载顺序在 sites-enabled 之前，所以站点配置里可以直接引用 mp_login）。
#
# 规则：每 IP 每分钟 10 次，允许 5 次突发。
# 只作用于 /auth/login 与 /auth/admin/login；
# auth_request 的内部校验（/auth/check）不经过这里，正常浏览不受影响。

limit_req_zone $binary_remote_addr zone=mp_login:1m rate=10r/m;
